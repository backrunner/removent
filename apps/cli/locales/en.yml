cli.name: removent-cli

usage: |
  removent-cli — Removent service management and connection diagnostics

  Usage: removent-cli [--verbose] <command>

  Commands:
    interactive Open the inline keyboard menu
    daemon     Inspect, start or stop the background service
    settings   Read, update or reset settings
    pairing    Show, generate or revoke codes, or watch pairing events
    identity   Show this device's identity
    ping       Test a connection to a device

  Global options:
    --json          Machine-readable output (ping: summary; watch: JSON Lines)
    --human         Readable output even when redirected
    -h, --help       Show help (also available on subcommands)
    -V, --version    Show version
    -v, --verbose    Show diagnostic logs and full error causes in the terminal

  With no command, an interactive terminal opens the inline menu.

  Examples:
    removent-cli daemon status
    removent-cli daemon start
    removent-cli daemon --help

help.daemon: |
  Usage: removent-cli daemon [action] [--verbose]

  Actions (default: status):
    status          Inspect sharing, sessions and permissions (use --json for scripts)
    enable          Enable sharing and save the setting
    disable         Disable sharing, keeping the background service running
    permissions     Request Screen Recording and Accessibility permissions
    reload          Reload saved settings (may interrupt active sessions)

  macOS service management:
    start           Start the background service
    stop            Stop until explicitly started again
    restart         Restart the service (interrupts active sessions)
    ensure          Start if needed, respecting an explicit stop
    install-defaults  Apply installation defaults, preserving explicit login/stop choices
    login-on        Start now and enable launch at login
    login-off       Disable launch at login, keeping the current service running
    service-status  Inspect login, process management and connectivity (use --json for scripts)

  status only queries state; an unavailable service prints a startup command.
  Terminal results are readable; pipes retain JSON. --json forces JSON.
  Use --verbose for logs and full error causes.

help.pairing: |
  Usage: removent-cli pairing [action] [--verbose]

  Actions (default: show):
    show       Show the current pairing code or PIN (use --json for scripts)
    generate   Generate a pairing code
    revoke     Revoke the pairing code
    watch      Watch pairing events (--json for JSON Lines); press Ctrl+C to stop

  Start the background service first: removent-cli daemon start

help.ping: |
  Usage:
    removent-cli ping <address|device-name|short-fingerprint> [options]
    removent-cli ping --relay-profile /path/to/controller.toml [options]

  Options:
    --pin <code>       Pairing PIN (read from stdin when needed)
    --count <n>        Number of pings, greater than 0 (default 4)
    --timeout <secs>   Discovery timeout, greater than 0 (default 10)
    --name <device>    Local display name (default RemoventCLI)
    -v, --verbose      Show diagnostic logs and full error causes

  Ping supports pairing-code and no-authentication hosts only.
  Use the desktop or mobile controller for system-account, password or OTP hosts.

  Example: removent-cli ping removent://192.168.1.10:48688 --count 4

help.identity: |
  Usage: removent-cli identity [--verbose]
  Show the certificate fingerprint and public key; --json forces JSON.
  Creates a local identity if one does not exist.

