[package]
name = "removent-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
removent-automation.workspace = true
serde_json.workspace = true
removent-core = { workspace = true }
removent-proto = { workspace = true }
removent-net = { workspace = true }
removent-relay = { workspace = true }
removent-media-codec = { workspace = true }
removent-media-capture = { workspace = true }
removent-input = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
des = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
libc.workspace = true


[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
apple-cf = "0.11"
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
pam-client = "0.5"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

# pam-sys disables bindgen defaults; explicitly load libclang when other build
# dependencies enable clang-sys runtime loading through feature unification.
[target.'cfg(target_os = "linux")'.build-dependencies]
bindgen = { version = "0.69", default-features = false, features = ["runtime"] }
