[package]
name = "removent-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "removent"
path = "src/main.rs"

[dependencies]
removent-core = { workspace = true }
removent-updater = { workspace = true }
removent-proto = { workspace = true }
removent-net = { workspace = true }
removent-relay = { workspace = true }
removent-input = { workspace = true }
removent-client = { workspace = true }

gpui = { package = "gpui-pre", version = "0.3" }
gpui-platform = { package = "gpui-pre-platform", version = "0.3", features = ["font-kit", "wayland", "x11"] }
gpui-component = "0.7"
gpui-kit-assets = "0.7"
image = "0.25"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
qrcode = { version = "0.14.1", default-features = false }
rust-i18n = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = "1"
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
libc = { workspace = true }

tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
cpal = { workspace = true }

[dev-dependencies]
tempfile = "3"
gpui = { package = "gpui-pre", version = "0.3", features = ["test-support"] }
gpui-platform = { package = "gpui-pre-platform", version = "0.3", features = ["test-support"] }
removent-media-codec = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
core-video = { version = "0.5.2", features = ["metal"] }
