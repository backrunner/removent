[package]
name = "removent-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "removent"
path = "src/main.rs"

[dependencies]
removent-core = { workspace = true }
removent-proto = { workspace = true }
removent-net = { workspace = true }
removent-relay = { workspace = true }
removent-input = { workspace = true }
removent-client = { workspace = true }

gpui = { package = "gpui-pre", version = "0.3" }
gpui-platform = { package = "gpui-pre-platform", version = "0.3", features = ["font-kit", "wayland", "x11"] }
gpui-component = "0.7"
image = "0.25"
rust-i18n = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = "1"
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
libc = { workspace = true }

tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
core-foundation = { workspace = true }
cpal = { workspace = true }

[dev-dependencies]
tempfile = "3"
gpui = { package = "gpui-pre", version = "0.3", features = ["test-support"] }
