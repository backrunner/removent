name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Tags gate on their exact main commit, so let main finish validation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '26.0'
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/website/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:docs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: Removent-website
          path: apps/website/build/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-browser-failures
          path: apps/website/test-results/
          retention-days: 7
  check:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install update signing dependency
        run: brew install openssl@3
      - run: cargo fmt --all --check
      - run: python3 scripts/check_layout.py
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=1
      - run: python3 scripts/release/gen_latest.py --self-test
      - run: bash scripts/check.sh
      - run: xcrun swift test --package-path apps/tray
      - run: bash apps/tray/Tests/run_integration_test.sh
      - run: xcrun swift test --package-path packages/apple-cloud-sync
      - run: bash scripts/build/build_cloud_sync.sh
      - run: find scripts apps/tray/Tests -name '*.sh' -exec bash -n {} \;
      - name: Check installer
        run: xcrun swiftc -typecheck -target arm64-apple-macosx26.0 apps/installer/main.swift
  build:
    needs: check
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package development bundle
        run: bash scripts/build/package.sh
      - name: Check CloudKit helper lifecycle without cloud access
        run: python3 scripts/qa/test_cloud_sync_helper.py
      - uses: actions/upload-artifact@v4
        with:
          name: Removent-development-not-notarized
          path: dist/*.zip
          retention-days: 7
