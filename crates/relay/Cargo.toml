[package]
name = "removent-relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
removent-core.workspace = true
removent-net.workspace = true
tokio.workspace = true
tokio-util.workspace = true
quinn.workspace = true
# 0.11.17 can underflow the DATAGRAM queue counter under congestion.
quinn-proto = "0.11.18"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
bytes.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
subtle = "2"
ipnet = { version = "2", features = ["serde"] }
futures.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
ed25519-dalek.workspace = true
clap = { version = "4", features = ["derive"] }
libc.workspace = true
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
semver = "1"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
removent-proto.workspace = true
tokio-rustls = "0.26"
