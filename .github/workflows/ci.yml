name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '13.0'
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:docs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: Removent-website
          path: website/build/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-browser-failures
          path: website/test-results/
          retention-days: 7
  check:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install update signing dependency
        run: brew install openssl@3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=1
      - run: python3 scripts/gen_latest.py --self-test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: bash tray/Tests/run_integration_test.sh
      - run: for script in scripts/*.sh; do bash -n "$script" || exit; done
      - name: Check installer
        run: xcrun swiftc -typecheck -target arm64-apple-macosx13.0 scripts/launcher.swift
  build:
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package development bundle
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Removent-development-not-notarized
          path: dist/*.zip
          retention-days: 7
