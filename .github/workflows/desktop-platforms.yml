name: Desktop platforms
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-platforms-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.platform }}
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Desktop observation dependency
        run: python -m pip install Pillow
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/build/linux-deps.sh
      - name: Windows assembler
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build desktop, host, tray and native probe
        run: cargo build --locked --release -p removent-app -p removent-daemon -p removent-tray -p removent-host -p removent-client --bins --example desktop_smoke --example ipc_smoke --example desktop_session_smoke --example credential_smoke
      - name: Daemon IPC and lifecycle
        shell: bash
        run: target/release/examples/ipc_smoke
      - name: Core protocol and persistence tests
        run: cargo test --locked -p removent-proto -p removent-core -p removent-input --lib -- --test-threads=1
      - name: Linux native desktop acceptance
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash -e -c '
            openbox > /tmp/openbox.log 2>&1 &
            python3 scripts/qa/portable_desktop.py
            python3 scripts/qa/portable_desktop.py --probe desktop_session_smoke
            target/release/removent-tray --smoke
            python3 scripts/qa/portable_app.py
            python3 scripts/qa/portable_credentials.py
          '
      - name: Windows native desktop acceptance
        if: runner.os == 'Windows'
        run: |
          python scripts/qa/portable_desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/qa/portable_desktop.py --probe desktop_session_smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tray = Start-Process target/release/removent-tray.exe -ArgumentList '--smoke' -PassThru
          if (-not $tray.WaitForExit(15000)) { $tray.Kill(); throw 'Tray failed to exit' }
          if ($tray.ExitCode -ne 0) { throw 'Tray smoke failed' }
          python scripts/qa/portable_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/qa/portable_credentials.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.platform }}
          path: target/qa-evidence
          if-no-files-found: ignore
      - name: Package desktop artifacts
        run: python scripts/build/package_portable.py --target ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: Removent-${{ matrix.platform }}
          path: |
            dist/Removent-${{ matrix.platform }}.zip
            dist/Removent-${{ matrix.platform }}.tar.gz
            dist/Removent-${{ matrix.platform }}.*.sha256
          if-no-files-found: error
          retention-days: 14
