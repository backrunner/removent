help.interactive: |
  Usage: removent-cli interactive
  Open the inline keyboard menu. Requires stdin, stdout and stderr on a terminal.
  Use arrow keys and Enter; Esc or q returns from a menu. Ctrl+C exits.
  Results stay in shell scrollback. Run without arguments for the same menu.

