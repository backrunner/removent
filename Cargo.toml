[workspace]
resolver = "3"
members = [
    "apps/cli",
    "apps/daemon",
    "apps/desktop",
    "apps/relay",
    "packages/client",
    "packages/core",
    "packages/host",
    "packages/input",
    "packages/media-capture",
    "packages/media-codec",
    "packages/mobile",
    "packages/net",
    "packages/proto",
    "packages/relay-transport",
]

[workspace.package]
version = "0.1.6-beta.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/backrunner/removent"
rust-version = "1.92"

[workspace.dependencies]
removent-core = { path = "packages/core" }
removent-proto = { path = "packages/proto" }
removent-net = { path = "packages/net" }
removent-media-capture = { path = "packages/media-capture" }
removent-media-codec = { path = "packages/media-codec" }
removent-input = { path = "packages/input" }
removent-client = { path = "packages/client" }
removent-host = { path = "packages/host" }
removent-relay = { package = "removent-relay-transport", path = "packages/relay-transport" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
postcard = { version = "1", features = ["alloc"] }
bytes = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rcgen = "0.14"
mdns-sd = "0.21"
spake2 = "0.4"
ed25519-dalek = { version = "2", features = ["pem"] }
rand = "0.10"
des = "0.9"
aes = "0.9"
md-5 = "0.11"
num-bigint = "0.5"
sha2 = "0.11"
hex = "0.4"
opus = "0.4"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray", "NSDictionary", "NSRunLoop", "NSThread", "NSObjCRuntime"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSImage", "NSApplication", "NSWorkspace"] }
core-graphics = "0.25"
core-foundation = "0.10"
cpal = "0.18"
rust-i18n = "4"
sys-locale = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "allow"

# apple-cf 0.11.0 hard-codes a macOS Swift bridge; keep the bridge on the target SDK.
[patch.crates-io]
apple-cf = { path = "vendor/apple-cf" }
videotoolbox = { path = "vendor/videotoolbox" }

# Chinese punctuation must stay attached when GPUI wraps text.
gpui-pre = { path = "vendor/gpui" }
