help.settings: |
  用法：removent-cli settings <操作> [--json] [--verbose]

  操作：
    list                 列出设置、当前值、可用值与生效方式
    get [设置名]         查询一项或全部设置
    set <设置名> <值>    修改并保存设置
    set <设置名> --stdin 从标准输入读取值（密码与 OTP 密钥必须使用）
    reset <设置名>       将一项设置恢复为默认值
    path                 显示当前配置文件路径

  示例：
    removent-cli settings set device_name "Office Mac"
    removent-cli settings set discovery.vnc true
    removent-cli settings set video_quality high-quality
    removent-cli settings get --json
    removent-cli settings set authentication.password --stdin < password.txt

  后台服务在线时会重新加载共享设置，可能中断当前会话。
  外观、发现与更新等桌面偏好在重新打开桌面端后生效。
  服务未启动时也能保存设置；查询始终隐藏密码与 OTP 密钥。

