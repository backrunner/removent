name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.1.0-beta.2'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '13.0'
  RELEASE_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify notarization credentials
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/notary-check.p8" "$RUNNER_TEMP/notary-history.json"' EXIT
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
              test -n "$APPLE_API_KEY_ID"
              test -n "$APPLE_API_ISSUER"
              printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-check.p8"
              xcrun notarytool history --key "$RUNNER_TEMP/notary-check.p8" \
                  --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
                  --output-format json > "$RUNNER_TEMP/notary-history.json"
          else
              test -n "$APPLE_ID"
              test -n "$APPLE_PASSWORD"
              test -n "$APPLE_TEAM_ID"
              printf '%s\n' "$APPLE_PASSWORD" | xcrun notarytool history \
                  --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                  --output-format json > "$RUNNER_TEMP/notary-history.json"
          fi
          echo 'Apple notarization authentication passed'
      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: |
          brew install cairo openssl@3
          python3 -m pip install -r scripts/requirements-release.txt
      - name: Validate source and release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$RELEASE_TAG" = "$(python3 scripts/release_meta.py tag)"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test -f "docs/releases/${RELEASE_TAG}.md"
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace -- --test-threads=1
          python3 scripts/gen_latest.py --self-test
      - name: Build and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          export UPDATE_SIGNING_KEY_FILE="$RUNNER_TEMP/update-signing-key.pem"
          trap 'rm -f "$RUNNER_TEMP/notary.p8" "$UPDATE_SIGNING_KEY_FILE"' EXIT
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$UPDATE_SIGNING_KEY"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$UPDATE_SIGNING_KEY_FILE"
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary.p8"
              printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH"
          fi
          bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_release.sh
