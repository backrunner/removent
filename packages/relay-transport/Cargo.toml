[package]
name = "removent-relay-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "removent_relay"

[dependencies]
removent-core.workspace = true
removent-net.workspace = true
tokio.workspace = true
tokio-util.workspace = true
quinn.workspace = true
# 0.11.17 can underflow the DATAGRAM queue counter under congestion.
quinn-proto = "0.11.18"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
bytes.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
anyhow.workspace = true
tracing.workspace = true
subtle = "2"
ipnet = { version = "2", features = ["serde"] }
futures.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "1"
tokio-rustls = "0.26"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
ed25519-dalek.workspace = true
tempfile = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
removent-proto.workspace = true
