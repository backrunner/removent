[package]
name = "removent-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "sync", "rt", "macros", "time", "net"] }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
rcgen = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
removent-proto = { workspace = true }
sys-locale = { workspace = true }

der = { version = "0.7", features = ["alloc", "pem", "std"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }

[dev-dependencies]
tempfile = "3"
pkcs8 = { version = "0.10", features = ["pem", "std"] }
