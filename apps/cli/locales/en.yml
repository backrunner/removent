help.settings: |
  Usage: removent-cli settings <action> [--json] [--verbose]

  Actions:
    list                 List keys, current values, accepted values and effects
    get [key]            Read one setting or all settings
    set <key> <value>    Update and save a setting
    set <key> --stdin    Read a value from stdin (required for passwords and OTP secrets)
    reset <key>          Restore one setting to its default
    path                 Show the current settings file path

  Examples:
    removent-cli settings set device_name "Office Mac"
    removent-cli settings set discovery.vnc true
    removent-cli settings set video_quality high-quality
    removent-cli settings get --json
    removent-cli settings set authentication.password --stdin < password.txt

  An online daemon reloads host settings, which may interrupt active sessions.
  Desktop preferences such as appearance, discovery and updates apply on reopening.
  Settings can be saved while offline. Passwords and OTP secrets are always hidden.

