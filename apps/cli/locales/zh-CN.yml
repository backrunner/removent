cli.name: removent-cli

usage: |
  removent-cli — Removent 服务管理与连接诊断

  用法：removent-cli [--verbose] <命令>

  命令：
    interactive 打开非全屏键盘菜单
    daemon     查询状态、启动或停止后台服务
    settings   查询、修改或重置各项设置
    pairing    查看、生成或撤销配对码，监听配对事件
    identity   查看本机身份（--json 可输出 JSON）
    ping       测试与目标设备的连接

  通用选项：
    --json          机器可读输出（ping 输出统计，watch 输出 JSON Lines）
    --human         重定向时也显示易读文本
    -h, --help       查看帮助（也可用于子命令）
    -V, --version    查看版本
    -v, --verbose    在终端显示诊断日志和完整错误原因

  无参数且连接交互终端时，打开非全屏菜单。

  示例：
    removent-cli daemon status
    removent-cli daemon start
    removent-cli daemon --help

help.daemon: |
  用法：removent-cli daemon [操作] [--verbose]

  操作（默认 status）：
    status          查询共享状态、会话和权限（--json 可输出 JSON）
    enable          开启共享并保存设置
    disable         关闭共享，保留后台服务
    permissions     请求屏幕录制与辅助功能权限
    reload          重新加载已保存的设置（可能中断当前会话）

  macOS 服务管理：
    start           启动后台服务
    stop            停止后台服务，直到手动启动
    restart         重启后台服务（会中断当前会话）
    ensure          按需启动，尊重手动停止的设置
    login-on        立即启动并开启登录时启动
    login-off       关闭登录时启动，保留当前服务
    service-status  查询登录启动、进程管理和连接状态（--json 可输出 JSON）

  status 只查询状态；后台服务不可用时会提示启动命令。
  终端默认显示易读结果，管道保持 JSON，--json 强制输出 JSON。
  使用 --verbose 查看诊断日志和完整错误原因。

help.pairing: |
  用法：removent-cli pairing [操作] [--verbose]

  操作（默认 show）：
    show       查看当前配对码或 PIN（--json 可输出 JSON）
    generate   生成配对码
    revoke     撤销配对码
    watch      持续显示配对事件（--json 输出 JSON Lines），按 Ctrl+C 结束

  需要先启动后台服务：removent-cli daemon start

help.ping: |
  用法：
    removent-cli ping <地址|设备名|短指纹> [选项]
    removent-cli ping --relay-profile /path/to/controller.toml [选项]

  选项：
    --pin <码>         配对 PIN（需要时从标准输入读取）
    --count <次数>     Ping 次数，必须大于 0（默认 4）
    --timeout <秒>     发现超时，必须大于 0（默认 10）
    --name <设备名>    本端显示名称（默认 RemoventCLI）
    -v, --verbose      显示诊断日志和完整错误原因

  Ping 仅支持配对码或无认证的被控端。
  系统账户、访问口令和 OTP 认证请使用桌面端或移动端连接验证。

  示例：removent-cli ping removent://192.168.1.10:48688 --count 4

help.identity: |
  用法：removent-cli identity [--verbose]
  输出本机证书指纹与公钥（--json 可输出 JSON）；尚无身份时创建本机身份。

